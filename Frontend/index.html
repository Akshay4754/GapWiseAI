<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upload your resume and a job description to get a match score, the skill gaps that matter, and a day-by-day interview plan." />
    <title>Gapwise — Your career, made clearer.</title>

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1210" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gapwise" />
    <meta property="og:url" content="https://gapwise-frontend.onrender.com/" />
    <meta property="og:title" content="Gapwise — Your career, made clearer." />
    <meta property="og:description" content="Match score, skill gaps and a day-by-day interview plan from your resume." />
    <meta property="og:image" content="https://gapwise-frontend.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gapwise: your career, made clearer. A match score card showing 86% and ranked skill gaps." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gapwise — Your career, made clearer." />
    <meta name="twitter:description" content="Match score, skill gaps and a day-by-day interview plan from your resume." />
    <meta name="twitter:image" content="https://gapwise-frontend.onrender.com/og-image.png" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme = "light";
        try {
          theme = localStorage.getItem("gapwise-theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=DM+Serif+Display:ital@0;1&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
